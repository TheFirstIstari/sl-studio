[package]
name = "sl-studio-backend"
version = "0.3.0"
description = "SL Studio - Forensic Document Analysis Platform (Rust backend)"
edition = "2021"
rust-version = "1.75"

[dependencies]
tauri = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1"
anyhow = "1"
num_cpus = "1"
sysinfo = "0.32"
reqwest = { version = "0.13", features = ["json", "rustls", "blocking"] }

[lib]
name = "sl_studio"
path = "src/lib.rs"

[[bin]]
name = "sl-studio-backend"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"
