[package]
name = "sl-studio"
version = "0.3.0"
description = "SL Studio - Forensic Document Analysis Platform"
authors = ["SL Studio Team"]
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "steinline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["full"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

regex = "1"

sha2 = "0.10"
hex = "0.4"

rayon = "1.10"

sysinfo = "0.32"

dirs = "5"
walkdir = "2"

reqwest = { version = "0.12", features = ["stream", "json", "blocking"] }
tokio-util = "0.7"
futures = "0.3"

chrono = { version = "0.4", features = ["serde"] }

thiserror = "1"
anyhow = "1"

num_cpus = "1"

pdf-extract = "0.7"
printpdf = "0.7"
ocrs = "0.12"
image = "0.25"
zip = "2"
# symphonia = { version = "0.5", features = ["all"] }
llama_cpp = { version = "0.3", features = ["metal"] }
rand = "0.8"
mupdf = "0.6"
whatlang = "0.16"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "database_bench"
harness = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 0

[profile.release]
# Optimize for runtime speed: forensic LLM inference + OCR + parallel
# extraction benefit far more from speed than the few MB we'd save with
# opt-level = "z". LTO and a single codegen unit keep the binary tight
# without sacrificing throughput. `panic = "abort"` removes unwind
# tables, which we don't need for a Tauri desktop app (we recover via
# Result everywhere; a real panic should crash the process).
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[package.metadata.clippy]
msrv = "1.75"
