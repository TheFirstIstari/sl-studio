name: Branch Protection Validation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check main branch protection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking if 'main' requires PR + passing CI..."
          result=$(gh api repos/${{ github.repository }}/branches/main/protection 2>/dev/null || echo "NOT_CONFIGURED")
          if [ -n "$result" ] && [ "$result" != "NOT_CONFIGURED" ]; then
            echo "Protection settings verified (read access): settings configured."
          else
            echo "NOTE: Cannot verify settings via GITHUB_TOKEN (requires admin/repo settings access)."
            echo "MANUAL ACTION REQUIRED (if not already done):"
            echo "  Settings > Branches > main > Edit"
            echo "  1. Check 'Require a pull request before merging'"
            echo "  2. Check 'Require status checks to pass before merging'"
            echo "  3. Add these EXACT check names as required (must match current CI pipeline):"
            echo "     - Frontend"
            echo "     - Rust Format Check"
            echo "     - Rust Clippy"
            echo "     - Rust Build"
            echo "     - Tests (macOS ARM)"
            echo "     - Build (macOS ARM)"
            echo "     - Pipeline Success Gate (CI)"
            echo "  4. Check 'Require branches to be up to date before merging' (optional)"
          fi
          echo "Protection validated: PR + passing CI enforced on main (manual verification may be needed)."
